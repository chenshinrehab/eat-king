      { id: 'se07', name: '金福越式河粉', cat: 'southeast', price: 1, rating: 4.5, reviews: 1200, lat: 24.8100, lng: 120.9650, addr: '新竹市北區', phone: '03-525-8888', tag: '生牛肉河粉', bookingType: 'phone' },
      { id: 'se08', name: '饗泰多 (巨城)', cat: 'southeast', price: 2, rating: 4.6, reviews: 1500, lat: 24.8090, lng: 120.9750, addr: '新竹市中央路', phone: '03-535-2222', tag: '厚煎海鮮排', bookingType: 'inline' },
      { id: 'se09', name: '瑪哈印度餐廳 (新竹)', cat: 'southeast', price: 2, rating: 4.7, reviews: 1100, lat: 24.8050, lng: 120.9650, addr: '新竹市', phone: '03-522-4444', tag: '烤餅', bookingType: 'phone' }
    ];

    const state = {
      step: 1,
      userCoords: { lat: 24.8272, lng: 121.0250 },
      radiusKm: 1.5,
      selectedPrices: [2],
      selectedCats: [],
      drawnShops: [],
      geminiApiKey: ''
    };

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2 - lat1)*Math.PI/180, dLon = (lon2 - lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function getEligiblePool() {
      return INITIAL_RESTAURANTS.map(s => ({...s, distance: getDistanceKm(state.userCoords.lat, state.userCoords.lng, s.lat, s.lng)}))
        .filter(s => s.distance <= state.radiusKm)
        .filter(s => state.selectedPrices.length === 0 || state.selectedPrices.includes(s.price));
    }

    function renderCategories() {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = '';
      const pool = getEligiblePool();
      
      CATEGORIES.forEach(c => {
        const hasItems = pool.some(s => s.cat === c.id);
        if (!hasItems && state.selectedCats.includes(c.id)) {
          state.selectedCats = state.selectedCats.filter(id => id !== c.id);
        }
        const btn = document.createElement('button');
        if (!hasItems) {
          btn.className = `p-2 rounded-xl text-xs font-bold border text-left bg-slate-100 border-slate-200 text-slate-400 opacity-40 cursor-not-allowed`;
          btn.innerHTML = `<span>${c.name}</span>`;
          btn.disabled = true;
        } else if (state.selectedCats.includes(c.id)) {
          btn.className = `p-2 rounded-xl text-xs font-bold border text-left bg-[#FF6A28] text-white shadow-sm flex justify-between`;
          btn.innerHTML = `<span>${c.name}</span><span>✓</span>`;
        } else {
          btn.className = `p-2 rounded-xl text-xs font-bold border text-left bg-slate-50 text-slate-700 hover:bg-slate-100`;
          btn.innerHTML = `<span>${c.name}</span>`;
        }
        if (hasItems) {
          btn.onclick = () => {
            state.selectedCats = state.selectedCats.includes(c.id) ? state.selectedCats.filter(id => id !== c.id) : [...state.selectedCats, c.id];
            renderCategories();
          };
        }
        grid.appendChild(btn);
      });
      document.getElementById('eligible-count').textContent = pool.filter(s => state.selectedCats.length === 0 || state.selectedCats.includes(s.cat)).length;
    }

    function handleDraw() {
      const pool = getEligiblePool().filter(s => state.selectedCats.length === 0 || state.selectedCats.includes(s.cat));
      if (pool.length === 0) return alert('目前條件下無相符餐廳，請放寬搜尋距離、多勾選幾項美食。');
      
      state.drawnShops = [...pool].sort(() => Math.random() - 0.5).slice(0, 5);
      switchStep(2);
    }

    async function handleAIDraw() {
      if (!state.geminiApiKey) return alert('請先點擊右上角設定，填入 Gemini API Key！');
      
      const mood = document.getElementById('input-mood').value.trim();
      const btn = document.getElementById('btn-ai-draw');
      const originHtml = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
      lucide.createIcons();

      try {
        const payload = {
          contents: [{ role: 'user', parts: [{ text: `我現在的心情是：「${mood || '隨便吃'}」，地點在座標 ${state.userCoords.lat}, ${state.userCoords.lng}。請幫我找 5 家真實餐廳。回傳格式必須為 JSON Array，屬性：id, name, rating, distance, phone, tag, bookingType(inline/phone), addr` }] }],
          generationConfig: { responseMimeType: 'application/json' }
        };
        // 優先使用 3.5-flash-lite，若失敗自動退回 3.1
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${state.geminiApiKey}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        if (!res.ok) {
          res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${state.geminiApiKey}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        }
        const data = await res.json();
        if (data.candidates && data.candidates[0].content) {
          state.drawnShops = JSON.parse(data.candidates[0].content.parts[0].text).slice(0, 5);
          switchStep(2);
        } else throw new Error('Format Error');
      } catch (e) {
        console.error(e);
        alert('AI 連線失敗，自動改為一般盲抽。');
        handleDraw();
      } finally {
        btn.innerHTML = originHtml;
      }
    }

    function renderStep2() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      state.drawnShops.forEach(shop => {
        const card = document.createElement('div');
        card.className = `rounded-2xl p-4 border-2 border-slate-200 cursor-pointer hover:border-orange-400 bg-white shadow-sm relative group`;
        
        let actionHtml = '';
        if (shop.bookingType === 'inline') {
          actionHtml += `<a href="https://inline.app/explore?keyword=${encodeURIComponent(shop.name)}" target="_blank" class="action-btn inline-block bg-blue-50 hover:bg-blue-100 text-blue-700 font-black text-[10px] px-2.5 py-1.5 rounded-xl border border-blue-200 shadow-sm ml-1.5 z-10">📱 Inline</a>`;
        }
        actionHtml += `<a href="tel:${shop.phone}" class="action-btn inline-block bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-black text-[10px] px-2.5 py-1.5 rounded-xl border border-emerald-200 shadow-sm ml-1.5 z-10">📞 撥號</a>`;

        card.innerHTML = `
          <div class="absolute top-3 right-3 flex items-center justify-end z-10">
            ${actionHtml}
          </div>
          <div class="pr-28 relative z-0">
            <h3 class="font-black text-lg text-slate-900 group-hover:text-orange-600 transition">${shop.name}</h3>
            <p class="text-[11px] text-slate-500 font-bold mt-0.5">⭐ ${shop.rating} ‧ 距離 ${shop.distance || 0} km</p>
            <p class="text-[11px] text-orange-700 font-bold mt-1.5 bg-orange-50 p-1.5 rounded-lg border border-orange-100 inline-block">🔥 特色: ${shop.tag}</p>
            <div class="mt-2 pt-2 border-t border-slate-100 text-[10px] text-slate-400 flex justify-between items-center truncate">
              📍 ${shop.addr}
            </div>
          </div>
        `;
        // 卡片本體點擊開啟 Google Maps
        card.onclick = () => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + ' ' + shop.addr)}`, '_blank');
        // 防止右上角按鈕觸發卡片的 onClick
        card.querySelectorAll('.action-btn').forEach(btn => btn.onclick = (e) => e.stopPropagation());
        
        container.appendChild(card);
      });
    }

    function switchStep(step) {
      if (step !== state.step) history.pushState({ step }, '');
      state.step = step;
      document.getElementById('step-1-view').classList.toggle('hidden', step !== 1);
      document.getElementById('step-2-view').classList.toggle('hidden', step !== 2);
      document.getElementById('nav-step-1').className = step === 1 ? 'py-1.5 rounded-lg bg-white shadow-sm text-orange-600 border border-orange-200' : 'py-1.5 rounded-lg text-slate-500';
      document.getElementById('nav-step-2').className = step === 2 ? 'py-1.5 rounded-lg bg-white shadow-sm text-orange-600 border border-orange-200' : 'py-1.5 rounded-lg text-slate-500';
      if (step === 2) renderStep2();
    }

    window.addEventListener('popstate', (e) => {
      const modals = [document.getElementById('settings-panel'), document.getElementById('map-modal')];
      if (modals.some(m => !m.classList.contains('hidden'))) {
        modals.forEach(m => m.classList.add('hidden'));
        return;
      }
      if (e.state && e.state.step) switchStep(e.state.step);
      else if (state.step > 1) switchStep(1);
    });

    window.onload = () => {
      state.geminiApiKey = localStorage.getItem('GEMINI_API_KEY') || '';
      document.getElementById('input-gemini-key').value = state.geminiApiKey;
      
      history.replaceState({ step: 1 }, '');
      renderCategories();
      lucide.createIcons();

      // UI Events
      document.getElementById('btn-toggle-settings').onclick = () => {
        document.getElementById('settings-panel').classList.toggle('hidden');
        history.pushState({ modal: 'settings' }, '');
      };
      document.getElementById('btn-close-settings').onclick = () => {
        state.geminiApiKey = document.getElementById('input-gemini-key').value.trim();
        localStorage.setItem('GEMINI_API_KEY', state.geminiApiKey);
        document.getElementById('settings-panel').classList.add('hidden');
      };
      
      document.querySelectorAll('.radius-btn').forEach(btn => {
        btn.onclick = () => {
          state.radiusKm = parseFloat(btn.dataset.radius);
          document.querySelectorAll('.radius-btn').forEach(b => b.className = 'radius-btn flex-1 py-1.5 text-xs font-bold border rounded-lg bg-slate-50 text-slate-600 border-slate-200');
          btn.className = 'radius-btn flex-1 py-1.5 text-xs font-bold border rounded-lg bg-[#FF6A28] text-white shadow-sm';
          renderCategories();
        };
      });

      document.querySelectorAll('.price-btn').forEach(btn => {
        btn.onclick = () => {
          const p = parseInt(btn.dataset.price);
          if (state.selectedPrices.includes(p) && state.selectedPrices.length > 1) {
            state.selectedPrices = state.selectedPrices.filter(x => x !== p);
            btn.className = 'price-btn p-2 rounded-xl border text-center bg-slate-50 text-slate-600 border-slate-200';
          } else if (!state.selectedPrices.includes(p)) {
            state.selectedPrices.push(p);
            btn.className = 'price-btn p-2 rounded-xl border text-center bg-[#FF6A28] text-white shadow-sm';
          }
          renderCategories();
        };
      });

      document.getElementById('btn-select-all-cats').onclick = () => { state.selectedCats = CATEGORIES.map(c=>c.id); renderCategories(); };
      document.getElementById('btn-clear-cats').onclick = () => { state.selectedCats = []; renderCategories(); };
      
      document.getElementById('btn-draw').onclick = handleDraw;
      document.getElementById('btn-ai-draw').onclick = handleAIDraw;
      document.getElementById('btn-reshuffle').onclick = handleDraw;
      document.getElementById('nav-step-1').onclick = () => switchStep(1);
      document.getElementById('nav-step-2').onclick = () => { if(state.drawnShops.length) switchStep(2); };

      // Map Picker
      document.getElementById('btn-open-map-picker').onclick = () => {
        document.getElementById('map-modal').classList.remove('hidden');
        document.getElementById('google-map-iframe').src = `https://maps.google.com/maps?q=${state.userCoords.lat},${state.userCoords.lng}&z=15&output=embed`;
        history.pushState({ modal: 'map' }, '');
      };
      document.getElementById('btn-cancel-map').onclick = () => document.getElementById('map-modal').classList.add('hidden');
      document.getElementById('btn-confirm-map').onclick = () => {
        document.getElementById('map-modal').classList.add('hidden');
        renderCategories();
      };
      
      document.querySelectorAll('.loc-quick').forEach(btn => {
        btn.onclick = () => {
          state.userCoords = { lat: parseFloat(btn.dataset.lat), lng: parseFloat(btn.dataset.lng) };
          document.getElementById('location-text').textContent = `📍 自訂：${btn.textContent}`;
          document.getElementById('google-map-iframe').src = `https://maps.google.com/maps?q=${state.userCoords.lat},${state.userCoords.lng}&z=16&output=embed`;
        };
      });
    };
  </script>
</body>
</html>
